name: CI

# This workflow runs on GitHub after each push synced from Replit via the
# post-merge script (scripts/post-merge.sh). It validates the codebase and
# provides a status check on each synced commit.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck
